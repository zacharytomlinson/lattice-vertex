[package]
name = "lattice-c6-wifi-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
receiver = []

[dependencies]
esp-hal = { version = "=1.1.2", features = ["esp32c6", "unstable"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c6"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32c6", "auto", "log-04"] }
esp-radio = { version = "=1.0.0-beta.0", features = ["esp32c6", "wifi", "unstable", "log-04", "print-logs-from-driver"] }
embassy-futures = "=0.1.2"
esp-rtos = { version = "=0.3.0", features = ["esp32c6", "esp-radio", "esp-alloc"] }
esp-alloc = { version = "=0.10.0", features = ["esp32c6"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
