[package]
name = "lattice-radio-probe"
version = "0.1.0"
edition = "2024"
publish = false

# Exercises lattice-vertex's portable radio module without starting its RTOS.
[workspace]

[features]
board-b = []
logging-critical-section = ["esp-println/critical-section"]
receive-notification = []

[dependencies]
lattice-vertex = { path = "../.." }
esp-alloc = "=0.10.0"
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c6"] }
esp-hal = { version = "=1.1.2", features = ["esp32c6", "unstable"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32c6", "auto"] }
esp-radio = { version = "=1.0.0-beta.0", features = ["esp32c6", "ieee802154", "unstable"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
