[package]
name = "lattice-nrf52840-kernel-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
radio-probe = ["dep:lattice-radio-test"]
peer-observer = ["dep:lattice-radio-test"]
xiao-bootloader = ["cortex-m-rt/set-vtor", "cortex-m-rt/set-sp"]
usb-console = ["dep:embassy-usb", "dep:embassy-futures"]

[[bin]]
name = "radio"
path = "src/bin/radio.rs"

[dependencies]
lattice-radio-test = { path = "../../../kernel/radio/tests", optional = true, features = ["runtime"] }
lattice-vertex = { path = "../../../..", default-features = false, features = ["port-nrf52840"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
rtt-target = "=0.6.2"
embassy-usb = { version = "=0.5.1", default-features = false, optional = true }
embassy-futures = { version = "=0.1.2", optional = true }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
