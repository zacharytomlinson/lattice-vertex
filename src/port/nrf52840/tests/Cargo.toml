[package]
name = "lattice-nrf52840-kernel-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
radio-probe = ["dep:lattice-radio-test"]
peer-observer = ["dep:lattice-radio-test"]
test-appliance = ["dep:lattice-radio-test"]
xiao-bootloader = ["cortex-m-rt/set-vtor", "cortex-m-rt/set-sp"]
usb-console = ["dep:embassy-usb", "dep:embassy-futures"]
update-test = ["xiao-bootloader", "usb-console", "lattice-vertex/nrf52840-update", "lattice-vertex/stack-overflow-check", "lattice-vertex/trace-facility", "lattice-vertex/test-support"]
update-image-b = ["update-test"]
ota-test = ["update-test", "lattice-vertex/firmware-update", "lattice-vertex/host-link"]
ota-image-b = ["ota-test"]
ota-stall-before-init = ["ota-image-b"]
ota-stall-before-radio = ["ota-image-b"]
ota-activation-check = ["ota-test"]
ota-staging-check = ["ota-test"]

[[bin]]
name = "ota"
path = "src/bin/ota.rs"
required-features = ["ota-test"]

[[bin]]
name = "radio"
path = "src/bin/radio.rs"

[[bin]]
name = "update"
path = "src/bin/update.rs"
required-features = ["update-test"]

[dependencies]
lattice-radio-test = { path = "../../../kernel/radio/tests", optional = true, features = ["runtime"] }
lattice-vertex = { path = "../../../..", default-features = false, features = ["port-nrf52840"] }
cortex-m = "0.7"
cortex-m-rt = "0.7"
rtt-target = "=0.6.2"
embassy-usb = { version = "=0.5.1", default-features = false, optional = true }
embassy-futures = { version = "=0.1.2", optional = true }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
