[package]
name = "lattice-nrf52840-boot"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[workspace]

[features]
loader = ["dep:embassy-nrf", "dep:cortex-m", "dep:cortex-m-rt"]

[[bin]]
name = "lattice-nrf52840-loader"
path = "src/bin/loader.rs"
required-features = ["loader"]
test = false
bench = false

[dependencies]
lattice-image-storage = { path = "../../../kernel/update/storage" }
embassy-boot = "=0.7.0"
embassy-embedded-hal = { version = "=0.6.0", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embedded-storage = "=0.3.1"
embassy-nrf = { version = "=0.11.0", optional = true, default-features = false, features = ["nrf52840", "rt", "unstable-pac"] }
cortex-m = { version = "0.7", optional = true, features = ["critical-section-single-core"] }
cortex-m-rt = { version = "0.7", optional = true, features = ["set-vtor", "set-sp"] }

[dev-dependencies]
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
