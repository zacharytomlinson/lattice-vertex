[package]
name = "lattice-c6-kernel-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
lattice-vertex = { path = "../../..", default-features = false, features = ["port-esp32c6"] }
esp-hal = { version = "=1.1.2", features = ["esp32c6", "unstable"] }
esp-bootloader-esp-idf = { version = "=0.5.0", features = ["esp32c6"] }
esp-println = { version = "=0.17.0", default-features = false, features = ["esp32c6", "auto", "critical-section"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2
