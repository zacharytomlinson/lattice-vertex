# FreeRTOS-in-Rust - FreeRTOS Kernel ported to Rust
#
# SPDX-License-Identifier: MIT
#
# This is a line-by-line translation of the FreeRTOS kernel from C to Rust.

[package]
name = "lattice-vertex"
version = "0.3.0"
edition = "2021"
authors = ["FreeRTOS-in-Rust Contributors"]
description = "Pure-Rust no_std FreeRTOS kernel translation with safe Rust APIs"
license = "MIT"
readme = false
publish = false
exclude = ["/experiments/", "/lab/"]
repository = "https://github.com/zacharytomlinson/lattice-vertex"
keywords = ["rtos", "embedded", "no-std", "freertos"]
categories = ["embedded", "no-std", "concurrency"]

[features]
# Compile-only default. Production targets must disable default features and
# select exactly one hardware port.
default = ["port-dummy"]

# Port selection (exactly one should be enabled)
# Each port specifies its arch width and tick width
port-dummy = ["arch-32bit", "tick-32bit"]  # For testing only
port-cortex-m0 = ["dep:cortex-m", "dep:cortex-m-rt", "arch-32bit", "tick-32bit"]
port-cortex-m3 = ["dep:cortex-m", "dep:cortex-m-rt", "arch-32bit", "tick-32bit"]
port-cortex-m4f = ["dep:cortex-m", "dep:cortex-m-rt", "arch-32bit", "tick-32bit"]
port-cortex-m7 = ["dep:cortex-m", "dep:cortex-m-rt", "arch-32bit", "tick-32bit"]
port-nrf52840 = ["use-mutexes", "dep:cortex-m", "dep:cortex-m-rt", "cortex-m/critical-section-single-core", "dep:embassy-nrf", "dep:embassy-sync", "arch-32bit", "tick-32bit"]
port-riscv32 = ["dep:riscv", "dep:riscv-rt", "arch-32bit", "tick-32bit"]
port-esp32c6 = ["use-mutexes", "dep:esp-hal", "dep:esp-phy", "dep:esp-sync", "dep:esp-wifi-sys-esp32c6", "dep:embassy-sync", "dep:heapless", "arch-32bit", "tick-32bit"]
port-cortex-a9 = ["arch-32bit", "tick-32bit"]
port-cortex-a53 = ["arch-64bit", "tick-64bit"]
port-test = ["std", "arch-32bit", "tick-32bit"]  # Deterministic host test port

# Hardware-test access to the resident radio task; contains no test workload.
test-support = []
# Optional local host attachment; ordinary appliances carry no USB/host state.
host-link = ["lattice-peer-wire/host", "use-mutexes"]
# Port storage/boot integration, optionally consumed by the common signed updater.
nrf52840-update = ["port-nrf52840", "dep:lattice-nrf52840-boot"]
esp32c6-update = ["port-esp32c6", "dep:lattice-c6-boot", "dep:esp-storage", "dep:esp-bootloader-esp-idf"]
firmware-update = ["dep:ed25519-dalek", "dep:sha2", "dep:lattice-image-storage", "dep:embedded-storage"]

# Architecture width for BaseType_t, UBaseType_t, StackType_t
arch-32bit = []
arch-64bit = []

# Tick counter width for TickType_t (selected by each supported port)
tick-32bit = []
tick-64bit = []

# Memory allocation (choose one)
heap-4 = []  # FreeRTOS heap_4: first-fit with coalescing, single contiguous region
heap-5 = []  # FreeRTOS heap_5: like heap_4 but supports multiple non-contiguous regions (PSRAM, etc.)
alloc = []   # Wrap Rust's #[global_allocator] instead

# Testing support.  Allocation is selected independently so every allocator
# configuration, including static-only operation, can be exercised on the host.
std = []

# Capability-only test matrix.  This deliberately selects no port,
# architecture width, tick width, allocator, user configuration, or SMP mode.
all-kernel-features = [
    "list-data-integrity-check",
    "trace-facility",
    "stack-overflow-check",
    "record-stack-high-address",
    "task-delete",
    "task-suspend",
    "abort-delay",
    "task-priority-set",
    "stack-high-water-mark",
    "use-mutexes",
    "timers",
    "stream-buffers",
    "queue-sets",
    "queue-registry",
    "pend-function-call",
    "application-task-tag",
    "thread-local-storage",
    "idle-yield",
    "stats-formatting",
    "generate-run-time-stats",
    "tickless-idle",
]

# Debug/diagnostic features
list-data-integrity-check = []  # configUSE_LIST_DATA_INTEGRITY_CHECK_BYTES
trace-facility = []             # configUSE_TRACE_FACILITY
stack-overflow-check = []       # configCHECK_FOR_STACK_OVERFLOW
record-stack-high-address = []  # configRECORD_STACK_HIGH_ADDRESS

# Task features (INCLUDE_* flags)
task-delete = []          # INCLUDE_vTaskDelete
task-suspend = []         # INCLUDE_vTaskSuspend
abort-delay = []          # INCLUDE_xTaskAbortDelay
task-priority-set = []    # INCLUDE_vTaskPrioritySet
stack-high-water-mark = [] # INCLUDE_uxTaskGetStackHighWaterMark

# Configuration
user-config = []              # User provides hardware-specific config (CPU clock, etc.)

# Kernel features
use-mutexes = []              # configUSE_MUTEXES
timers = []                   # configUSE_TIMERS
stream-buffers = []           # configUSE_STREAM_BUFFERS
queue-sets = []               # configUSE_QUEUE_SETS
queue-registry = []           # configQUEUE_REGISTRY_SIZE > 0
pend-function-call = []       # INCLUDE_xTimerPendFunctionCall
application-task-tag = []     # configUSE_APPLICATION_TASK_TAG
thread-local-storage = []     # configNUM_THREAD_LOCAL_STORAGE_POINTERS
idle-yield = []               # Yield in idle task
stats-formatting = []         # configUSE_STATS_FORMATTING_FUNCTIONS
generate-run-time-stats = []  # configGENERATE_RUN_TIME_STATS
tickless-idle = []            # configUSE_TICKLESS_IDLE

# TODO: Future features
# smp = []  # Multi-core support (configNUMBER_OF_CORES > 1)
# mini-list-item = []  # configUSE_MINI_LIST_ITEM optimization

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
lattice-image-storage = { path = "src/kernel/update/storage", optional = true }
embedded-storage = { version = "=0.3.1", optional = true }
lattice-peer-wire = { path = "src/kernel/peer/wire" }
lattice-nrf52840-boot = { path = "src/port/nrf52840/boot", optional = true }
lattice-c6-boot = { path = "src/port/esp32c6/boot", optional = true }
esp-storage = { version = "=0.9.0", optional = true, features = ["esp32c6", "bytewise-read"] }
esp-bootloader-esp-idf = { version = "=0.5.0", optional = true, features = ["esp32c6"] }
lattice-ir = { git = "ssh://git@github.com/zacharytomlinson/lattice-ir.git", rev = "8cc8629fc6b94f32848d0fc0336db8cbcea79596" }
# Portable MAC framing for common peer discovery; no allocator or radio driver.
ieee802154 = "=0.6.1"
byte = { version = "0.2.7", default-features = false }

# Cortex-M support (optional, for port-cortex-m*)
cortex-m = { version = "0.7", optional = true }
cortex-m-rt = { version = "0.7", optional = true }

# RISC-V support (optional, for port-riscv32)
riscv = { version = "0.12", optional = true }
riscv-rt = { version = "0.16", optional = true }

# ESP owns startup and peripheral routing; Lattice owns task scheduling.
esp-hal = { version = "=1.1.2", optional = true, features = ["esp32c6", "unstable"] }

# Nordic peripheral support without the Embassy executor or time driver.
embassy-nrf = { version = "=0.11.0", optional = true, default-features = false, features = ["nrf52840", "rt", "unstable-pac"] }

# C6 PHY support for the extracted, statically buffered 802.15.4 driver.
esp-phy = { version = "=0.2.0", optional = true, features = ["esp32c6"] }
esp-sync = { version = "=0.2.1", optional = true, features = ["esp32c6"] }
esp-wifi-sys-esp32c6 = { version = "=0.2.0", optional = true }
embassy-sync = { version = "0.8", optional = true }
heapless = { version = "0.9", optional = true }
